<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UserList</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>

<body>
<nav class="navbar bg-dark px-4 py-2">
    <div class="d-flex gap-2 text-white">
        <span id="currentUserEmail"></span>
        <span>with roles</span>
        <span id="currentUserRoles"></span>
    </div>

    <div class="d-flex gap-2">
        <form id="logoutForm" action="/logout" method="post">
            <input type="hidden" name="_csrf" id="csrfToken">
            <button type="submit" class="btn btn-dark text-secondary">
                Logout
            </button>
        </form>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <div class="col-2 bg-white min-vh-100 pt-3 px-0">
            <div class="nav nav-pills flex-column w-100 text-center">
                <button id="adminTab" type="button" class="nav-link active rounded-0 d-none">Admin</button>
                <button id="userTab" type="button" class="nav-link active rounded-0">User</button>
            </div>
        </div>

        <main class="col-10 bg-light min-vh-100 p-4">
            <div id="adminPanel" class="d-none">
                <h2>Admin panel</h2>

                <ul class="nav nav-tabs">
                    <li class="nav-item">
                        <button id="allUsersPanelTabButton" type="button" class="nav-link active">All Users</button>
                    </li>
                    <li class="nav-item">
                        <button id="addUserPanelTabButton" type="button" class="nav-link">New User</button>
                    </li>
                </ul>

                <div id="allUsersPanelTab" class="d-none">
                    <div class="card rounded-0">
                        <div class="card-header fw-bold">All Users</div>

                        <div class="card-body">
                            <table id="usersTable" class="table table-striped">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>First Name</th>
                                        <th>Last Name</th>
                                        <th>Age</th>
                                        <th>Email</th>
                                        <th>Roles</th>
                                        <th>Edit</th>
                                        <th>Delete</th>
                                    </tr>
                                </thead>

                                <tbody id="usersTableBody"></tbody>
                            </table>

                            <div id="usersMessage" class="alert alert-danger d-none" data-alert-type="danger" role="alert"></div>
                        </div>
                    </div>
                </div>

                <div id="addUserPanelTab" class="d-none">
                    <div class="card rounded-0">
                        <div class="card-header fw-bold">Add new users</div>

                        <div class="card-body">
                            <form id="addUserForm" class="d-flex flex-column align-items-center">
                                <div class="mb-3 w-50 text-center">
                                    <label class="form-label fw-bold">FirstName</label>
                                    <input id="addFirstName" class="form-control" type="text">
                                    <label id="addFirstNameError" class="form-label text-danger"></label>
                                </div>

                                <div class="mb-3 w-50 text-center">
                                    <label class="form-label fw-bold">LastName</label>
                                    <input id="addLastName" class="form-control" type="text">
                                    <label id="addLastNameError" class="form-label text-danger"></label>
                                </div>

                                <div class="mb-3 w-50 text-center">
                                    <label class="form-label fw-bold">Age</label>
                                    <input id="addAge" class="form-control" type="number">
                                    <label id="addAgeError" class="form-label text-danger"></label>
                                </div>

                                <div class="mb-3 w-50 text-center">
                                    <label class="form-label fw-bold">Email</label>
                                    <input id="addEmail" class="form-control" type="email">
                                    <label id="addEmailError" class="form-label text-danger"></label>
                                </div>

                                <div class="mb-3 w-50 text-center">
                                    <label class="form-label fw-bold">Password</label>
                                    <input id="addPassword" class="form-control" type="password">
                                    <label id="addPasswordError" class="form-label text-danger"></label>
                                </div>

                                <div class="mb-3 w-50 text-center">
                                    <label class="form-label fw-bold">Roles</label>
                                    <select id="addRoles" class="form-select" multiple size="2"></select>
                                    <label id="addRolesError" class="form-label text-danger"></label>
                                </div>

                                <div id="addUserMessage" class="alert alert-danger d-none" data-alert-type="danger" role="alert"></div>

                                <button type="submit" class="btn btn-success">Add new user</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <div id="userPanel" class="d-none">
                <h2>User Information Page</h2>

                <div class="card rounded-0">
                    <div class="card-header fw-bold">About User</div>

                    <div class="card-body">
                        <table class="table table-striped">
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>First Name</th>
                                <th>Last Name</th>
                                <th>Age</th>
                                <th>Email</th>
                                <th>Roles</th>
                            </tr>
                            </thead>

                            <tbody id="currentUserTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<div id="modalsContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script src="/js/api/csrf.js"></script>

<script src="/js/components/editUserModal.js"></script>
<script src="/js/components/deleteUserModal.js"></script>
<script src="/js/components/modals.js"></script>

<script src="/js/messages.js"></script>
<script src="/js/roles.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/validation.js"></script>
<script src="/js/tabs.js"></script>

<script src="/js/panel/adminPanels.js"></script>
<script src="/js/panel/allUsersPanel.js"></script>
<script src="/js/panel/addUserPanel.js"></script>
<script src="/js/panel/userPanel.js"></script>

<script src="/js/main.js"></script>

</body>
</html>
