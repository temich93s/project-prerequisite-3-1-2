<div class="modal fade" id="editModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Edit user</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <form id="editUserForm">
        <div class="modal-body">
          <div class="d-flex flex-column align-items-center">

            <div class="mb-3 w-50 text-center">
              <label class="form-label fw-bold">ID</label>
              <input id="editId" class="form-control text-secondary" disabled>
            </div>

            <div class="mb-3 w-50 text-center">
              <label class="form-label fw-bold">First Name</label>
              <input id="editFirstName" class="form-control" type="text">
              <div id="firstNameError" class="text-danger small mt-1"></div>
            </div>

            <div class="mb-3 w-50 text-center">
              <label class="form-label fw-bold">Last Name</label>
              <input id="editLastName" class="form-control" type="text">
              <div id="lastNameError" class="text-danger small mt-1"></div>
            </div>

            <div class="mb-3 w-50 text-center">
              <label class="form-label fw-bold">Age</label>
              <input id="editAge" class="form-control" type="number">
              <div id="ageError" class="text-danger small mt-1"></div>
            </div>

            <div class="mb-3 w-50 text-center">
              <label class="form-label fw-bold">Email</label>
              <input id="editEmail" class="form-control" type="email">
              <div id="emailError" class="text-danger small mt-1"></div>
            </div>

            <div class="mb-3 w-50 text-center">
              <label class="form-label fw-bold">Password</label>
              <input id="editPassword" class="form-control" type="password" placeholder="Leave blank to keep current">
            </div>

            <div class="mb-3 w-50 text-center">
              <label class="form-label fw-bold">Roles</label>
              <select id="editRoles" class="form-select" multiple size="2">
                <option value="ADMIN">ADMIN</option>
                <option value="USER">USER</option>
              </select>
              <div id="roleDtoNamesError" class="text-danger small mt-1"></div>
            </div>

            <div id="editError" class="alert alert-danger d-none" role="alert"></div>

          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button type="submit" class="btn btn-primary">Edit</button>
        </div>

      </form>
    </div>
  </div>
</div>
