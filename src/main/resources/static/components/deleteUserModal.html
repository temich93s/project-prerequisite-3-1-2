<div class="modal fade" id="deleteModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Delete user</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <div class="d-flex flex-column align-items-center">

          <div class="mb-3 w-50 text-center">
            <label class="form-label fw-bold">ID</label>
            <input id="deleteId" class="form-control" disabled>
          </div>

          <div class="mb-3 w-50 text-center">
            <label class="form-label fw-bold">First Name</label>
            <input id="deleteFirstName" class="form-control" disabled>
          </div>

          <div class="mb-3 w-50 text-center">
            <label class="form-label fw-bold">Last Name</label>
            <input id="deleteLastName" class="form-control" disabled>
          </div>

          <div class="mb-3 w-50 text-center">
            <label class="form-label fw-bold">Age</label>
            <input id="deleteAge" class="form-control" disabled>
          </div>

          <div class="mb-3 w-50 text-center">
            <label class="form-label fw-bold">Email</label>
            <input id="deleteEmail" class="form-control" disabled>
          </div>

          <div class="mb-3 w-50 text-center">
            <label class="form-label fw-bold">Roles</label>
            <input id="deleteRoles" class="form-control" disabled>
          </div>

          <div id="deleteError" class="alert alert-danger d-none" data-alert-type="danger" role="alert"></div>

        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" id="confirmDeleteButton" class="btn btn-danger">Delete</button>
      </div>

    </div>
  </div>
</div>
