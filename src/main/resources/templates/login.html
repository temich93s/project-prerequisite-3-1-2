<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UserList</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>

<body>
    <div class="container">
        <div class="d-flex flex-column align-items-center mt-5">
            <h4 class="mb-3">Please sign in</h4>

            <form th:action="@{/login}" method="post" style="width: 250px">
                <input type="email" name="username" placeholder="Email address" class="form-control">
                <input type="password" name="password" placeholder="Password" class="form-control">
                <button type="submit" class="btn btn-primary w-100 mt-2">Sign in</button>
            </form>
        </div>
    </div>
</body>
</html>
