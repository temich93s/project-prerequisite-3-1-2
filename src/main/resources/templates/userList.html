<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="UTF-8">
        <title>UserList</title>
    </head>

    <body>
        <h1>User list</h1>

        <div sec:authorize="isAuthenticated()">
            <span> User:
                <b>
                    <span sec:authentication="name"></span>
                </b>
            </span>

            <form th:action="@{/logout}" method="post" style="display:inline; margin-left: 10px;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit">Logout</button>
            </form>
        </div>

        <p> <a th:href="@{/user}">Back to profile</a></p>

        <p th:if="${message}" th:text="${message}"></p>

        <div th:if="${loadSuccess}">
            <br>
            <a th:href="@{/admin/addUser}">
                <button type="button">Add user</button>
            </a>
            <a th:href="@{/admin/updateUser}">
                <button type="button">Update user</button>
            </a>
            <a th:href="@{/admin/removeUser}">
                <button type="button">Remove user</button>
            </a>
        </div>

        <br>

        <table border="2" th:if="${loadSuccess}">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>FirstName</th>
                    <th>LastName</th>
                    <th>Age</th>
                    <th>Email</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="user : ${users}">
                    <td th:text="${user.id}"></td>
                    <td th:text="${user.firstName}"></td>
                    <td th:text="${user.lastName}"></td>
                    <td th:text="${user.age}"></td>
                    <td th:text="${user.email}"></td>
                </tr>
            </tbody>
        </table>
    </body>
</html>
