<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="UTF-8">
        <title>UserList</title>
    </head>

    <body sec:authorize="hasRole('ADMIN')">
        <h1>User list</h1>

        <span> User:
            <b><span sec:authentication="name"></span></b>
        </span>

        <form th:action="@{/logout}" method="post" style="display: inline">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit">Logout</button>
        </form>

        <span sec:authorize="hasRole('USER')">
            <a th:href="@{/user}"><button type="button">Profile</button></a>
            <br>
        </span>

        <table border="2" th:if="${loadSuccess}">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Roles</th>
                    <th>FirstName</th>
                    <th>LastName</th>
                    <th>Age</th>
                    <th>Email</th>
                    <th>Update</th>
                    <th>Remove</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="user : ${users}">
                    <td th:text="${user.id}"></td>
                    <td th:text="${user.username}"></td>
                    <td><span th:each="roleName : ${user.roleNames}" th:text="${roleName + ' '}"></span></td>
                    <td th:text="${user.firstName}"></td>
                    <td th:text="${user.lastName}"></td>
                    <td th:text="${user.age}"></td>
                    <td th:text="${user.email}"></td>
                    <td><a th:href="@{/admin/updateUser/{id}(id=${user.id})}">
                        <button type="button">Update</button>
                    </a></td>
                    <td><form th:action="@{/admin/removeUser/{id}(id=${user.id})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit">Remove</button>
                    </form></td>
                </tr>
            </tbody>
        </table>

        <div th:if="${loadSuccess}">
            <br>
            <a th:href="@{/admin/addUser}">
                <button type="button">Add user</button>
            </a>
        </div>

        <p th:if="${message}" th:text="${message}"></p>
    </body>
</html>
