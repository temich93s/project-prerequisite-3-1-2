<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UserList</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>

<body sec:authorize="hasAnyRole('ADMIN', 'USER')">
    <nav class="navbar bg-dark px-4 py-2">
        <div class="d-flex gap-2 text-white">
            <span th:text="${currentUser.getEmail()}"></span>
            <span>with roles</span>
            <span th:text="${currentUser.getRoleDtoNamesAsString()}"></span>
        </div>

        <div class="d-flex gap-2">
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-dark text-secondary">Logout</button>
            </form>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <div class="col-2 bg-white min-vh-100 pt-3 px-0">
                <div class="nav nav-pills flex-column w-100 text-center">
                    <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/userList}" class="nav-link active rounded-0">Admin</a>
                    <a sec:authorize="hasAnyRole('ADMIN', 'USER')" th:href="@{/user}" class="nav-link rounded-0">User</a>
                </div>
            </div>

            <main class="col-10 bg-light min-vh-100 p-4">
                <h2>Admin panel</h2>

                <ul class="nav nav-tabs">
                    <li class="nav-item">
                        <a th:href="@{/admin/userList}" class="nav-link active">All Users</a>
                    </li>
                    <li class="nav-item">
                        <a th:href="@{/admin/addUser}" class="nav-link">New User</a>
                    </li>
                </ul>

                <div class="card rounded-0">
                    <div class="card-header fw-bold">All Users</div>

                    <div class="card-body">
                        <table class="table table-striped" th:if="${loadSuccess}">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>First Name</th>
                                    <th>Last Name</th>
                                    <th>Age</th>
                                    <th>Email</th>
                                    <th>Roles</th>
                                    <th>Edit</th>
                                    <th>Delete</th>
                                </tr>
                            </thead>

                            <tbody>
                                <tr th:each="user : ${users}">
                                    <td th:text="${user.id}"></td>
                                    <td th:text="${user.firstName}"></td>
                                    <td th:text="${user.lastName}"></td>
                                    <td th:text="${user.age}"></td>
                                    <td th:text="${user.email}"></td>
                                    <td th:text="${user.getRoleDtoNamesAsString()}"></td>
                                    <td>
                                        <button type="button"
                                                class="btn btn-info text-white"
                                                data-bs-toggle="modal"
                                                th:data-bs-target="'#editModal' + ${user.id}">
                                            Edit
                                        </button>
                                        <div class="modal fade" th:id="'editModal' + ${user.id}" tabindex="-1">
                                            <div th:replace="~{fragments/updateUser :: updateUser(${user})}"></div>
                                        </div>
                                    </td>
                                    <td>
                                        <button type="button"
                                                class="btn btn-danger text-white"
                                                data-bs-toggle="modal"
                                                th:data-bs-target="'#removeModal' + ${user.id}">
                                            Delete
                                        </button>
                                        <div class="modal fade" th:id="'removeModal' + ${user.id}" tabindex="-1">
                                            <div th:replace="~{fragments/removeUser :: removeUser(${user})}"></div>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>

                        <p th:if="${message}" th:text="${message}" class="text-start text-info"></p>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
