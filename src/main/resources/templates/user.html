<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UserList</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>

<body sec:authorize="hasAnyRole('ADMIN', 'USER')">
    <nav class="navbar bg-dark px-4 py-2">
        <div class="d-flex gap-2 text-white">
            <span th:text="${user.getEmail()}"></span>
            <span>with roles</span>
            <span th:text="${user.getRoleDtoNamesAsString()}"></span>
        </div>

        <div class="d-flex gap-2">
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-dark text-secondary">Logout</button>
            </form>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <div class="col-2 bg-white min-vh-100 pt-3 px-0">
                <div class="nav nav-pills flex-column w-100 text-center">
                    <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/userList}" class="nav-link rounded-0">Admin</a>
                    <a sec:authorize="hasAnyRole('ADMIN', 'USER')" th:href="@{/user}" class="nav-link active rounded-0">User</a>
                </div>
            </div>

            <main class="col-10 bg-light min-vh-100 p-4">
                <h2>User Information Page</h2>

                <div class="card rounded-0">
                    <div class="card-header fw-bold">About User</div>

                    <div class="card-body">
                        <table class="table table-striped">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>First Name</th>
                                    <th>Last Name</th>
                                    <th>Age</th>
                                    <th>Email</th>
                                    <th>Roles</th>
                                </tr>
                            </thead>

                            <tbody>
                                <tr>
                                    <td th:text="${user.getId()}"></td>
                                    <td th:text="${user.getFirstName()}"></td>
                                    <td th:text="${user.getLastName()}"></td>
                                    <td th:text="${user.getAge()}"></td>
                                    <td th:text="${user.getEmail()}"></td>
                                    <td th:text="${user.getRoleDtoNamesAsString()}"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>
</body>
</html>
