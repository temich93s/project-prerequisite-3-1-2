<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="UTF-8">
        <title>UserList</title>
    </head>

    <body sec:authorize="hasRole('USER')">
        <h1>User profile</h1>

        <span> User:
            <b><span sec:authentication="name"></span></b>
        </span>

        <form th:action="@{/logout}" method="post" style="display:inline">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit">Logout</button>
        </form>

        <span sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/admin/userList}"><button type="button">To UserList</button></a>
        </span>

        <p>Username: <span th:text="${user.username}"></span></p>
        <p>First name: <span th:text="${user.firstName}"></span></p>
        <p>Last name: <span th:text="${user.lastName}"></span></p>
        <p>Age: <span th:text="${user.age}"></span></p>
        <p>Email: <span th:text="${user.email}"></span></p>
    </body>
</html>
