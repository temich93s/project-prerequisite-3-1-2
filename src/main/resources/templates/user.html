<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
    <head>
        <title>Spring Security Example</title>
    </head>

    <body>
        <h2>User profile</h2>

        <div sec:authorize="isAuthenticated()">
            <span> User:
                <b>
                    <span sec:authentication="name"></span>
                </b>
            </span>

            <form th:action="@{/logout}" method="post" style="display:inline; margin-left: 10px;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit">Logout</button>
            </form>
        </div>

        <p>Username: <span th:text="${user.username}"></span></p>
        <p>First name: <span th:text="${user.firstName}"></span></p>
        <p>Last name: <span th:text="${user.lastName}"></span></p>
        <p>Age: <span th:text="${user.age}"></span></p>
        <p>Email: <span th:text="${user.email}"></span></p>
    </body>
</html>
