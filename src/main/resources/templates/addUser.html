<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UserList</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>

<body sec:authorize="hasRole('ADMIN')">
    <nav class="navbar bg-dark px-4 py-2">
        <div class="d-flex gap-2 text-white">
            <span th:text="${user.getEmail()}"></span>
            <span>with roles</span>
            <span th:text="${user.getRoleNamesAsString()}"></span>
        </div>

        <div class="d-flex gap-2">
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-dark text-secondary">Logout</button>
            </form>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <div class="col-2 bg-white min-vh-100 pt-3 px-0">
                <div class="nav nav-pills flex-column w-100 text-center">
                    <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/userList}" class="nav-link active rounded-0">Admin</a>
                    <a sec:authorize="hasAnyRole('ADMIN', 'USER')" th:href="@{/user}" class="nav-link rounded-0">User</a>
                </div>
            </div>

            <main class="col-10 bg-light min-vh-100 p-4">
                <h2>Admin panel</h2>

                <ul class="nav nav-tabs">
                    <li class="nav-item">
                        <a th:href="@{/admin/userList}" class="nav-link">All Users</a>
                    </li>
                    <li class="nav-item">
                        <a th:href="@{/admin/addUser}" class="nav-link active">New User</a>
                    </li>
                </ul>

                <div class="card rounded-0">
                    <div class="card-header fw-bold">Add new users</div>

                    <div class="card-body">
                        <form th:action="@{/admin/addUser}" th:object="${userDto}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <label>Username:<input type="text" th:field="*{username}"></label>
                            <label th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></label>
                            <br>
                            <br>
                            <label>Password:<input type="password" th:field="*{password}"></label>
                            <label th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></label>
                            <br>
                            <br>
                            <label>Role:<select th:field="*{roleNames}" multiple>
                                <option th:each="name : ${roleNames}" th:value="${name}" th:text="${name}"></option>
                            </select></label>
                            <label th:if="${#fields.hasErrors('roleNames')}" th:errors="*{roleNames}"></label>
                            <br>
                            <br>
                            <label>FirstName:<input type="text" th:field="*{firstName}"></label>
                            <label th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></label>
                            <br>
                            <br>
                            <label>LastName:<input type="text" th:field="*{lastName}"></label>
                            <label th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></label>
                            <br>
                            <br>
                            <label>Age:<input type="number" th:field="*{age}"></label>
                            <label th:if="${#fields.hasErrors('age')}" th:errors="*{age}"></label>
                            <br>
                            <br>
                            <label>Email:<input type="email" th:field="*{email}"></label>
                            <label th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></label>
                            <br>
                            <br>
                            <button type="submit">Add user</button>
                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>
</body>
</html>
