<div th:fragment="updateUser(user)">
  <div class="modal-dialog">
    <div class="modal-content">

    <div class="modal-header">
      <h5 class="modal-title">Edit user</h5>
      <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
    </div>

    <form th:action="@{/admin/updateUser/{id}(id=${user.id})}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <div class="modal-body">
        <div class="d-flex flex-column align-items-center">
          <div class="mb-3 w-50 text-center">
            <label class="form-label fw-bold">ID</label>
            <input class="form-control text-secondary" disabled type="text" th:value="${user.id}">
          </div>

          <div class="mb-3 w-50 text-center">
            <label class="form-label fw-bold">First Name</label>
            <input class="form-control" type="text" name="firstName" th:value="${user.firstName}">
          </div>

          <div class="mb-3 w-50 text-center">
            <label class="form-label fw-bold">Last Name</label>
            <input class="form-control" type="text" name="lastName" th:value="${user.lastName}">
          </div>

          <div class="mb-3 w-50 text-center">
            <label class="form-label fw-bold">Age</label>
            <input class="form-control" type="number" name="age" th:value="${user.age}">
          </div>

          <div class="mb-3 w-50 text-center">
            <label class="form-label fw-bold">Email</label>
            <input class="form-control" type="email" name="email" th:value="${user.email}">
          </div>

          <div class="mb-3 w-50 text-center">
            <label class="form-label fw-bold">Password</label>
            <input class="form-control" type="password" name="password" th:value="${user.password}">
          </div>

          <div class="mb-3 w-50 text-center">
            <label class="form-label fw-bold">Roles</label>
              <select class="form-select" multiple size="2" name="roleDtoNames">
                <option th:each="name : ${roleDtoNames}"
                  th:value="${name}"
                  th:text="${name}"
                  th:selected="${user.roleDtoNames.contains(name)}">
                </option>
              </select>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" >Close</button>
        <button type="submit" class="btn btn-primary">Edit</button>
      </div>
    </form>
  </div>
</div>
</div>
